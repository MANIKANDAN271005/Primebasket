{% load static %}
<nav class="navbar navbar-expand-xl navbar-light sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <img src="{% static 'images/logo.svg' %}" alt="PrimeBasket logo" width="42" height="42" />
      <span class="brand-text">PrimeBasket</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-xl-0">
        <li class="nav-item"><a class="nav-link active" href="{% url 'home' %}#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#categories">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#offers">Offers</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#reviews">Reviews</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#contact">Contact</a></li>
      </ul>

      <form class="d-flex align-items-center gap-2 navbar-search position-relative" role="search" id="searchForm" autocomplete="off">
        <div class="input-group">
          <span class="input-group-text border-0"><i class="bi bi-search"></i></span>
          <input class="form-control border-0" id="productSearch" type="search" placeholder="Search groceries" aria-label="Search groceries" />
        </div>
        <button class="btn btn-success btn-sm" type="submit">Search</button>
        <div class="search-suggestions d-none" id="searchSuggestions"></div>
      </form>

      <div class="nav-actions d-flex align-items-center gap-2 ms-xl-3 mt-3 mt-xl-0">
        <a class="nav-icon-btn text-decoration-none position-relative" href="{% url 'wishlist' %}" aria-label="Wishlist">
          <i class="bi bi-heart"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill nav-badge nav-badge--heart" id="wishlistCount">0</span>
        </a>
        <a class="nav-icon-btn text-decoration-none position-relative" href="{% url 'cart' %}" aria-label="Cart">
          <i class="bi bi-bag"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill nav-badge" id="cartCounter">0</span>
        </a>
        {% if is_authenticated %}
        <div class="dropdown">
          <button class="btn btn-outline-success btn-sm dropdown-toggle d-flex align-items-center gap-1" type="button" id="userMenuToggle" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <span class="nav-user-name">{{ current_user_fullname }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuToggle">
            <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person-fill me-2"></i>Profile</a></li>
            <li><a class="dropdown-item" href="{% url 'orders' %}"><i class="bi bi-bag-check-fill me-2"></i>My Orders</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <form method="post" action="{% url 'logout' %}" class="px-3 py-1">
                {% csrf_token %}
                <button type="submit" class="dropdown-item px-0 text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
              </form>
            </li>
          </ul>
        </div>
        {% else %}
        <a class="btn btn-outline-success btn-sm" href="{% url 'login' %}">Login</a>
        <a class="btn btn-success btn-sm" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
