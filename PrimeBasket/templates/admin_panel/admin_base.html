{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}PrimeBasket Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/admin.css' %}" />
  </head>
  <body class="admin-body">
    <div class="admin-shell" id="adminShell">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">
          <img src="{% static 'images/logo.svg' %}" alt="PrimeBasket" width="36" height="36" />
          <span>PrimeBasket<small>Admin Panel</small></span>
        </div>
        <nav class="admin-nav">
          <a href="{% url 'admin_dashboard' %}" class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
          </a>
          <a href="{% url 'admin_products' %}" class="{% if 'product' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-box-seam-fill"></i> Products
          </a>
          <a href="{% url 'admin_categories' %}" class="{% if 'categor' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-tags-fill"></i> Categories
          </a>
          <a href="{% url 'home' %}" target="_blank" rel="noreferrer">
            <i class="bi bi-box-arrow-up-right"></i> View Site
          </a>
        </nav>
        <form method="post" action="{% url 'admin_logout' %}" class="admin-logout-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light w-100"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
        </form>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <button class="admin-menu-toggle" type="button" id="adminMenuToggle" aria-label="Toggle menu">
            <i class="bi bi-list"></i>
          </button>
          <div class="admin-topbar-user"><i class="bi bi-person-circle"></i> {{ admin_username }}</div>
        </header>

        <main class="admin-content">
          {% if messages %}
          {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          {% endfor %}
          {% endif %}

          {% block admin_content %}{% endblock %}
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('adminMenuToggle')?.addEventListener('click', () => {
        document.getElementById('adminShell')?.classList.toggle('sidebar-open');
      });
    </script>
  </body>
</html>
