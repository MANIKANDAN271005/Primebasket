{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PrimeBasket Admin | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/admin.css' %}" />
  </head>
  <body>
    <div class="admin-auth-shell">
      <div class="admin-auth-card">
        <div class="admin-auth-brand">
          <img src="{% static 'images/logo.svg' %}" alt="PrimeBasket" width="34" height="34" />
          <span>PrimeBasket Admin</span>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger" role="alert">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Admin username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control" id="username" name="username" required autofocus />
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="password" name="password" required />
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login to Admin Panel
          </button>
        </form>

        <p class="text-muted small text-center mt-4 mb-0">
          This is a separate login from customer accounts. Admin accounts are created with
          <code>python manage.py create_admin</code>.
        </p>
      </div>
    </div>
  </body>
</html>
